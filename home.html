<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Greenway Visa Center</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
}

/* 🌈 Background */
body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(circle at 20% 20%, rgba(52,199,89,0.25), transparent 40%),
    radial-gradient(circle at 80% 30%, rgba(0,122,255,0.25), transparent 40%),
    linear-gradient(135deg, #eef2f7, #dfe9f3);
}

/* HEADER CENTER */
.header{
  display:flex;
  flex-direction:column;
  align-items:center;
  margin-bottom:30px;
}

/* BIG LOGO */
.logo img{
  width:110px;
  height:110px;
  object-fit:contain;
  border-radius:20px;
  box-shadow:0 15px 30px rgba(0,0,0,0.1);
}

/* TITLE */
h1{
  margin-top:15px;
  font-size:28px;
  font-weight:600;
  color:#34c759;
  text-align:center;
  letter-spacing:0.5px;
}

/* USER NAME */
.user-box{
  margin-top:12px;
  padding:10px 18px;
  background:rgba(255,255,255,0.7);
  backdrop-filter:blur(20px);
  border-radius:14px;
  font-size:14px;
  font-weight:600;
  color:#333;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

/* Container */
.container{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
  justify-content:center;
}

/* Cards */
.card{
  width:260px;
  padding:30px;
  border-radius:18px;
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(20px);
  box-shadow:0 20px 40px rgba(0,0,0,0.1);
  text-align:center;
  cursor:pointer;
  transition:0.3s;
}

.card:hover{
  transform:translateY(-6px);
}

.card h2{
  font-size:18px;
  margin-bottom:10px;
}

.card p{
  font-size:13px;
  color:#666;
}

.card span{
  display:inline-block;
  margin-top:15px;
  padding:10px 18px;
  border-radius:12px;
  background:#34c759;
  color:white;
  font-size:13px;
}

/* Logout Button */
.logout-btn{
  margin-top:30px;
  padding:14px 30px;
  border:none;
  border-radius:14px;
  background:#ff3b30;
  color:white;
  font-size:14px;
  cursor:pointer;
  box-shadow:0 10px 25px rgba(255,59,48,0.25);
  transition:0.3s;
}

.logout-btn:hover{
  transform:translateY(-3px);
}

/* Responsive */
@media(max-width:600px){

  .container{
    flex-direction:column;
  }

  h1{
    font-size:22px;
  }

}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">

  <div class="logo">
    <img src="logo.png" alt="Logo">
  </div>

  <h1>Greenway Visa Center</h1>

  <!-- USER NAME -->
  <div class="user-box">
    👋 Welcome,
    <span id="userName"></span>
  </div>

</div>

<!-- CARDS -->
<div class="container">

  <div class="card" onclick="goRegister()">
    <h2>Register Student</h2>
    <p>Add new student details</p>
    <span>Open</span>
  </div>

  <div class="card" onclick="goFind()">
    <h2>Find Students</h2>
    <p>Search student records</p>
    <span>Search</span>
  </div>

  <div class="card" onclick="gooncall()">
    <h2>On-Call Registration</h2>
    <p>Register students for on-call sessions</p>
    <span>On-Call</span>
  </div>

</div>

<!-- LOGOUT -->
<button class="logout-btn" onclick="logout()">
  Logout
</button>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

/* Firebase Config */
const firebaseConfig = {
  apiKey: "AIzaSyCzf-_CUf9g9CN9J7_e5GuAAROpbi6Zw3w",
  authDomain: "gw-system-6e4cc.firebaseapp.com",
  projectId: "gw-system-6e4cc",
  storageBucket: "gw-system-6e4cc.appspot.com",
  messagingSenderId: "591268620894",
  appId: "1:591268620894:web:3d3e9a06c3fb632cac22cf"
};

/* Initialize Firebase */
const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

/* CHECK LOGIN */
onAuthStateChanged(auth, (user)=>{

  if(user){

    // SHOW USER NAME
    document.getElementById("userName").innerText =
      user.displayName || user.email;

  }else{

    // REDIRECT TO LOGIN
    window.location.href = "index.html";

  }

});

/* NAVIGATION */
window.goRegister = function(){
  window.location.href = "student.html";
}

window.goFind = function(){
  window.location.href = "search.html";
}

window.gooncall = function(){
  window.location.href = "on_call.html";
}

/* LOGOUT */
window.logout = async function(){

  await signOut(auth);

  window.location.href = "index.html";

}

</script>

</body>
</html>
