<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Greenway Visa Center</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
}

/* 🌈 Background */
body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(circle at 20% 20%, rgba(52,199,89,0.25), transparent 40%),
    radial-gradient(circle at 80% 30%, rgba(0,122,255,0.25), transparent 40%),
    linear-gradient(135deg, #eef2f7, #dfe9f3);
}

/* HEADER CENTER */
.header{
  display:flex;
  flex-direction:column;
  align-items:center;
  margin-bottom:30px;
}

/* BIG LOGO */
.logo img{
  width:110px;
  height:110px;
  object-fit:contain;
  border-radius:20px;
  box-shadow:0 15px 30px rgba(0,0,0,0.1);
}

/* TITLE */
h1{
  margin-top:15px;
  font-size:28px;
  font-weight:600;
  color:#34c759;
  text-align:center;
  letter-spacing:0.5px;
}

/* Container */
.container{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
  justify-content:center;
}

/* Cards */
.card{
  width:260px;
  padding:30px;
  border-radius:18px;
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(20px);
  box-shadow:0 20px 40px rgba(0,0,0,0.1);
  text-align:center;
  cursor:pointer;
  transition:0.3s;
}

.card:hover{
  transform:translateY(-6px);
}

.card h2{
  font-size:18px;
  margin-bottom:10px;
}

.card p{
  font-size:13px;
  color:#666;
}

.card span{
  display:inline-block;
  margin-top:15px;
  padding:10px 18px;
  border-radius:12px;
  background:#34c759;
  color:white;
  font-size:13px;
}

/* Responsive */
@media(max-width:600px){
  .container{
    flex-direction:column;
  }
  h1{
    font-size:22px;
  }
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">
    <img src="logo.png" alt="Logo">
  </div>

  <h1>Greenway Visa Center</h1>
</div>

<!-- CARDS -->
<div class="container">

  <div class="card" onclick="goRegister()">
    <h2>Register Student</h2>
    <p>Add new student details</p>
    <span>Open</span>
  </div>

  <div class="card" onclick="goFind()">
    <h2>Find Students</h2>
    <p>Search student records</p>
    <span>Search</span>
  </div>

</div>

<script>
function goRegister(){
  window.location.href = "student.html";
}

function goFind(){
  window.location.href = "search.html";
}
</script>

</body>
</html>
